[package]
name = "nospe"
version = "0.1.0"
description = "Nospe – Scannen, PDF, Paperless"
authors = ["Nospe"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"

[features]
# Standardmäßig wird das Custom-Protocol für den Production-Build genutzt.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
